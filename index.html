<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grootboek — Vermogen</title>
<meta name="theme-color" content="#0A0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grootboek">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0A0D12;
    --surface:#12161F;
    --surface-2:#181D29;
    --hairline:rgba(237,239,244,0.07);
    --hairline-strong:rgba(237,239,244,0.14);
    --ivory:#EDEFF4;
    --muted:#8891A3;
    --muted-dim:#5B6377;
    --green:#00E28A;
    --green-soft:rgba(0,226,138,0.14);
    --purple:#8C6DFF;
    --purple-soft:rgba(140,109,255,0.16);
    --red:#FF5C5C;
    --red-soft:rgba(255,92,92,0.14);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ivory);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:64px;
  }
  .wrap{max-width:960px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) 18px calc(0px + env(safe-area-inset-bottom,0px));}
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

  .masthead{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:16px;margin-bottom:20px;
  }
  .masthead .brand{font-size:14px;font-weight:700;letter-spacing:-0.01em;color:var(--ivory);display:flex;align-items:center;gap:8px;}
  .masthead .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}
  .masthead .date-view{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .masthead-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .data-actions{display:flex;gap:6px;}
  .data-actions .btn{padding:4px 10px;font-size:11px;}

  .hero{padding:4px 0 20px;}
  .hero-title{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .hero .amount{font-family:'Inter',sans-serif;font-weight:800;font-size:clamp(36px,9vw,54px);line-height:1;letter-spacing:-0.02em;}
  .hero .delta{margin-top:12px;font-size:13px;}

  .badge{
    display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;
    padding:4px 9px;border-radius:20px;font-family:'IBM Plex Mono',monospace;
  }
  .badge.up{background:var(--green-soft);color:var(--green);}
  .badge.down{background:var(--red-soft);color:var(--red);}
  .badge.flat{background:var(--surface-2);color:var(--muted);}

  /* Period selector */
  .period-row{display:flex;gap:6px;margin:14px 0 22px;flex-wrap:wrap;}
  .period-chip{
    font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--muted);
    background:var(--surface);border:1px solid var(--hairline);border-radius:8px;
    padding:6px 12px;cursor:pointer;transition:all .12s ease;
  }
  .period-chip:hover{border-color:var(--hairline-strong);color:var(--ivory);}
  .period-chip.active{background:var(--ivory);color:#0A0D12;border-color:var(--ivory);}

  /* Stat cards: totaal / cash / beleggingen */
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px;}
  .stat-card{
    background:var(--surface);border:1px solid var(--hairline);border-radius:12px;padding:14px 14px 12px;
    font-family:'Inter',sans-serif;text-align:left;cursor:pointer;width:100%;transition:border-color .15s ease, background .15s ease;
    color:var(--ivory);-webkit-appearance:none;appearance:none;
  }
  .stat-card:hover{border-color:var(--hairline-strong);}
  .stat-card.active{border-color:var(--ivory);background:var(--surface-2);}
  .stat-card .slabel{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .stat-card .slabel .sw{width:7px;height:7px;border-radius:50%;}
  .stat-card .samount{font-size:16px;font-weight:700;font-family:'IBM Plex Mono',monospace;margin-bottom:8px;color:var(--ivory);}
  .stat-card .speriod{font-size:10px;color:var(--muted-dim);margin-top:6px;}
  @media(max-width:520px){
    .stat-card .samount{font-size:13px;}
    .stats-grid{gap:7px;}
    .stat-card{padding:10px 9px;}
  }

  /* Ledger scrubber */
  .ledger{position:relative;margin:0 0 26px;padding:16px 0 8px;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);}
  .ledger-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .ledger-title .t{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted-dim);font-weight:700;}
  .ledger-actions{display:flex;gap:8px;}
  .track{position:relative;height:44px;}
  .track .rail{position:absolute;top:22px;left:0;right:0;height:1px;background:var(--hairline-strong);}
  .track .fill{position:absolute;top:22px;left:0;height:2px;background:var(--green);}
  .tick{position:absolute;top:16px;width:1px;height:13px;background:var(--muted-dim);cursor:pointer;}
  .tick.active{background:var(--green);width:2px;top:13px;height:19px;}
  .tick .dot{position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--green);display:none;}
  .tick.active .dot{display:block;}
  .tick:hover .tooltip{display:block;}
  .tooltip{display:none;position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--hairline-strong);border-radius:6px;padding:4px 8px;font-size:11px;white-space:nowrap;font-family:'IBM Plex Mono',monospace;color:var(--ivory);pointer-events:none;}

  .btn{font-family:'Inter',sans-serif;font-size:12px;font-weight:700;background:transparent;color:var(--muted);border:1px solid var(--hairline-strong);border-radius:10px;padding:7px 13px;cursor:pointer;transition:all .15s ease;}
  .btn:hover{border-color:var(--green);color:var(--green);}
  .btn.primary{background:var(--green);color:#06140D;border-color:var(--green);}
  .btn.primary:hover{background:#33e9a2;color:#06140D;}
  .btn.ghost{border-color:transparent;color:var(--muted-dim);}
  .btn.ghost:hover{color:var(--red);border-color:transparent;}
  .btn.small{padding:5px 11px;font-size:11px;}

  .grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px;}
  @media(min-width:720px){.grid{grid-template-columns:0.85fr 1.15fr;}}
  .card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  .add-entry-card h3{margin-bottom:8px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted-dim);font-weight:700;}
  .add-entry-hint{font-size:12px;color:var(--muted-dim);margin:0 0 14px;line-height:1.5;}
  .card-hint{font-size:12px;color:var(--muted-dim);margin:-10px 0 14px;line-height:1.4;}
  .add-entry-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .compare-dates-row{display:flex;align-items:flex-end;gap:12px;margin:14px 0 18px;flex-wrap:wrap;}
  .compare-date-field{display:flex;flex-direction:column;gap:5px;}
  .compare-date-field label{font-size:10px;color:var(--muted-dim);text-transform:uppercase;letter-spacing:0.06em;}
  .compare-arrow{color:var(--muted-dim);font-size:14px;padding-bottom:9px;}
  .compare-row{display:grid;grid-template-columns:1.3fr 0.9fr 0.9fr 1.2fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--hairline);font-size:12px;align-items:center;}
  .compare-row:last-child{border-bottom:none;}
  .compare-row.header{color:var(--muted-dim);font-size:10px;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--hairline-strong);padding-bottom:10px;}
  .compare-row .name{color:var(--ivory);}
  .compare-row.indent .name{padding-left:4px;}
  .compare-row .val{font-family:'IBM Plex Mono',monospace;text-align:right;color:var(--muted);}
  .compare-row .delta{font-family:'IBM Plex Mono',monospace;text-align:right;font-weight:700;}
  .compare-row .delta.up{color:var(--green);}
  .compare-row .delta.down{color:var(--red);}
  .compare-row .delta.flat{color:var(--muted);}
  .compare-row .deltapct{font-weight:500;opacity:0.75;}
  .compare-summary{margin-top:6px;padding-top:4px;border-top:1px solid var(--hairline-strong);}
  .compare-summary .compare-row .name{font-weight:700;}
  @media(max-width:480px){
    .compare-row{grid-template-columns:1.1fr 0.8fr 0.8fr 1.1fr;font-size:11px;}
    .compare-row .deltapct{display:block;font-size:9px;}
  }
  .add-entry-row input[type="date"]{flex:1;min-width:150px;padding:9px 10px;font-size:13px;}
  .add-entry-row .btn{white-space:nowrap;}
  .grid .card{margin-bottom:0;}
  .card h3{margin:0 0 16px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted-dim);font-weight:700;}

  .donut-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .donut-canvas-box{position:relative;width:170px;height:170px;}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:0 14px;text-align:center;}
  .donut-center .pct{font-size:22px;font-weight:800;line-height:1.15;}
  .donut-center .lbl{font-size:9px;color:var(--muted-dim);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}
  .donut-center .sub{font-size:11px;font-weight:700;margin-top:4px;padding:2px 8px;border-radius:10px;background:var(--surface-2);}
  .legend-row.highlight{background:var(--surface-2);border-radius:8px;margin:0 -8px;padding:9px 8px;}
  .legend{width:100%;display:flex;flex-direction:column;gap:10px;}
  .card-head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .card-head-row h3{margin:0;}
  .legend-row{display:flex;align-items:center;gap:10px;font-size:13px;}
  .legend-row-edit input.cat-name-input{
    flex:1;background:var(--surface-2);border:1px solid var(--hairline);border-radius:8px;
    color:var(--ivory);font-family:'Inter',sans-serif;font-size:13px;padding:7px 9px;outline:none;
  }
  .legend-row-edit input.cat-name-input:focus{border-color:var(--green);}
  .legend-row .sw{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
  .legend-row .name{flex:1;color:var(--ivory);}
  .legend-row .pct{color:var(--muted);width:44px;text-align:right;}
  .legend-row .amt{font-family:'IBM Plex Mono',monospace;width:92px;text-align:right;font-size:12px;}
  .legend-group-title{font-size:10px;color:var(--muted-dim);text-transform:uppercase;letter-spacing:0.06em;margin:10px 0 6px;}
  .legend-group-title:first-child{margin-top:0;}

  .chart-box{height:230px;}
  .chart-box.small{height:170px;}
  .grid-charts{grid-template-columns:1fr;}
  @media(min-width:720px){.grid-charts{grid-template-columns:1fr 1fr;}}
  .sw-inline{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;}
  .mini-legend{display:flex;gap:14px;}
  .mini-legend-item{font-size:11px;color:var(--muted);display:flex;align-items:center;}

  .editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .editor-head .t{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted-dim);font-weight:700;}
  .group-block{margin-top:16px;}
  .group-block .glabel{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:7px;font-weight:600;}
  .group-block .glabel .dot{width:7px;height:7px;border-radius:50%;}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hairline);}
  .row:last-child{border-bottom:none;}
  .row input.name-input{flex:1;background:transparent;border:none;color:var(--ivory);font-family:'Inter',sans-serif;font-size:14px;outline:none;padding:4px 0;}
  .row input.name-input::placeholder{color:var(--muted-dim);}
  .row .amt-input-wrap{display:flex;align-items:center;gap:4px;}
  .row .amt-input-wrap .eur{color:var(--muted-dim);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .row input.amt-input{width:120px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:8px;color:var(--ivory);font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:right;padding:6px 9px;outline:none;}
  .row input.amt-input:focus{border-color:var(--green);}
  .row-del{background:none;border:none;color:var(--muted-dim);cursor:pointer;font-size:15px;padding:2px 4px;line-height:1;}
  .row-del:hover{color:var(--red);}
  .add-cat{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--muted-dim);background:none;border:1px dashed var(--hairline-strong);border-radius:10px;padding:7px 12px;cursor:pointer;width:100%;justify-content:center;}
  .add-cat:hover{color:var(--green);border-color:var(--green);}

  .editor-footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--hairline);flex-wrap:wrap;gap:10px;}
  .footer-total{font-size:13px;color:var(--muted);}
  .footer-total .num{color:var(--ivory);}

  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty .etitle{font-size:19px;font-weight:700;color:var(--ivory);margin-bottom:6px;}
  .empty p{font-size:13px;margin:0 0 18px;color:var(--muted-dim);}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green);color:#06140D;font-size:13px;font-weight:700;padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  ::selection{background:var(--green-soft);}
  input[type="date"]{background:var(--surface-2);border:1px solid var(--hairline);border-radius:8px;color:var(--ivory);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 8px;outline:none;color-scheme:dark;}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="brand"><span class="dot"></span>Grootboek</div>
    <div class="masthead-right">
      <div class="date-view" id="dateViewLabel">—</div>
      <div class="data-actions">
        <button class="btn ghost small" id="exportBtn">Exporteren</button>
        <button class="btn ghost small" id="importBtn">Importeren</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
    </div>
  </div>

  <div class="hero">
    <div class="hero-title" id="heroTitle">Vermogen</div>
    <div class="amount num" id="heroAmount">€ 0</div>
    <div class="delta flat" id="heroDelta"></div>
  </div>

  <div class="period-row" id="periodRow"></div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="ledger" id="ledgerBlock">
    <div class="ledger-title">
      <div class="t">Tijdreis</div>
      <div class="ledger-actions">
        <input type="date" id="jumpDate">
      </div>
    </div>
    <div class="track" id="track">
      <div class="rail"></div>
      <div class="fill" id="fill"></div>
    </div>
  </div>

  <div id="mainContent"></div>

</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'wealth-data';
let state = { categories: [], snapshots: {} };
let selectedDate = null;
let selectedPeriod = 'ALL';
let donutChart = null;
let lineChart = null;
let cashLineChart = null;
let investLineChart = null;
let stackedChart = null;
let mutationChart = null;
let allocationChart = null;
let yearlyChart = null;
let categoryEditMode = false;
let donutFilter = 'total';
let addEntryExpanded = false;
let compareExpanded = false;
let compareDateA = null;
let compareDateB = null;

const PERIODS = [
  {key:'1M', label:'1M'},
  {key:'3M', label:'3M'},
  {key:'6M', label:'6M'},
  {key:'YTD', label:'YTD'},
  {key:'1J', label:'1J'},
  {key:'ALL', label:'Alles'},
];

const fmtMoney = (v) => new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v||0);
const fmtDateShort = (iso) => new Date(iso+'T00:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'});
const todayISO = () => new Date().toISOString().slice(0,10);
const uid = () => Math.random().toString(36).slice(2,9);
const fmtPct = (v) => (v>0?'+':v<0?'−':'') + Math.abs(v).toFixed(1).replace('.',',') + '%';

function defaultCategories(){
  return [
    {id: 'c1', name:'Betaalrekening ING', group:'cash'},
    {id: 'c2', name:'Spaarrekening ABN Amro', group:'cash'},
    {id: 'c3', name:'Spaarrekening ING', group:'cash'},
    {id: 'c4', name:'Effectenrekening 1', group:'invest'},
    {id: 'c5', name:'Effectenrekening 2', group:'invest'},
    {id: 'c6', name:'Synvest', group:'invest'},
    {id: 'c7', name:'Effectenrekening De Giro', group:'invest'},
  ];
}
function historicalSeed(){
  return {
    '2023-01-01': { c1:8000,  c2:35000, c3:0,     c4:0, c5:0,      c6:2500, c7:25500  },
    '2023-06-01': { c1:8000,  c2:38000, c3:0,     c4:0, c5:0,      c6:2550, c7:31000  },
    '2024-01-01': { c1:5500,  c2:50500, c3:0,     c4:0, c5:0,      c6:2600, c7:38500  },
    '2024-01-25': { c1:7200,  c2:50500, c3:0,     c4:0, c5:0,      c6:2600, c7:40500  },
    '2024-04-25': { c1:9500,  c2:51000, c3:0,     c4:0, c5:0,      c6:2600, c7:44500  },
    '2024-08-01': { c1:7500,  c2:51800, c3:100000,c4:0, c5:0,      c6:2680, c7:50000  },
    '2025-01-01': { c1:9500,  c2:47000, c3:68000, c4:0, c5:0,      c6:2690, c7:59000  },
    '2025-08-01': { c1:900,   c2:42000, c3:27000, c4:73000, c5:100000, c6:2800, c7:0  },
    '2026-04-18': { c1:1200,  c2:32000, c3:27000, c4:83000, c5:116000, c6:2972, c7:0  },
  };
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      state = JSON.parse(res.value);
      if(!state.categories || state.categories.length===0) state.categories = defaultCategories();
      if(!state.snapshots) state.snapshots = {};
    } else {
      state = {categories: defaultCategories(), snapshots: {}};
    }
    // Niet-destructieve aanvulling: voeg ontbrekende categorieën en historische
    // invoerdata toe zonder bestaande, mogelijk al aangepaste data te overschrijven.
    let changed = false;
    defaultCategories().forEach(dc=>{
      if(!state.categories.find(c=>c.id===dc.id)){ state.categories.push(dc); changed = true; }
    });
    const seed = historicalSeed();
    Object.keys(seed).forEach(d=>{
      if(!state.snapshots[d]){ state.snapshots[d] = seed[d]; changed = true; }
    });
    if(changed) await saveState();
  }catch(e){
    state = {categories: defaultCategories(), snapshots: historicalSeed()};
  }
}
async function saveState(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
  catch(e){ showToast('Opslaan mislukt — probeer opnieuw'); }
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}

function sortedDates(){ return Object.keys(state.snapshots).sort(); }
function totalForDate(date){
  const snap = state.snapshots[date];
  if(!snap) return 0;
  return Object.values(snap).reduce((a,b)=>a+(Number(b)||0),0);
}
function groupTotalAt(date, group){
  const snap = state.snapshots[date] || {};
  return state.categories.filter(c=>c.group===group).reduce((a,c)=>a+(Number(snap[c.id])||0),0);
}
function nearestSnapshotOnOrBefore(date){
  const dates = sortedDates().filter(d=>d<=date);
  return dates.length ? dates[dates.length-1] : null;
}
function valueAt(date, group){
  const snapDate = nearestSnapshotOnOrBefore(date);
  if(!snapDate) return null;
  if(group==='total') return totalForDate(snapDate);
  return groupTotalAt(snapDate, group);
}
function periodStartISO(period, refISO){
  const ref = new Date(refISO+'T00:00:00');
  let d = new Date(ref);
  if(period==='1M') d.setMonth(d.getMonth()-1);
  else if(period==='3M') d.setMonth(d.getMonth()-3);
  else if(period==='6M') d.setMonth(d.getMonth()-6);
  else if(period==='1J') d.setFullYear(d.getFullYear()-1);
  else if(period==='YTD') d = new Date(ref.getFullYear(),0,1);
  else return null;
  return d.toISOString().slice(0,10);
}
function growthPct(group, period, refDate){
  const dates = sortedDates();
  if(dates.length===0) return null;
  const endVal = valueAt(refDate, group);
  let startVal;
  if(period==='ALL'){
    startVal = valueAt(dates[0], group);
  } else {
    let target = periodStartISO(period, refDate);
    if(target < dates[0]) target = dates[0];
    startVal = valueAt(target, group);
  }
  if(startVal===null || endVal===null || startVal===0) return null;
  return ((endVal-startVal)/Math.abs(startVal))*100;
}

/* ---------- Ledger scrubber ---------- */
function renderLedger(){
  const track = document.getElementById('track');
  const fill = document.getElementById('fill');
  track.querySelectorAll('.tick').forEach(n=>n.remove());
  const dates = sortedDates();
  document.getElementById('jumpDate').value = selectedDate || todayISO();
  if(dates.length===0){ fill.style.width='0%'; return; }
  const first = new Date(dates[0]+'T00:00:00').getTime();
  const last = new Date(dates[dates.length-1]+'T00:00:00').getTime();
  const span = Math.max(last-first, 1);
  dates.forEach(d=>{
    const t = (new Date(d+'T00:00:00').getTime()-first)/span;
    const pct = dates.length===1 ? 50 : t*100;
    const el = document.createElement('div');
    el.className = 'tick' + (d===selectedDate ? ' active' : '');
    el.style.left = `calc(${pct}% - 1px)`;
    el.innerHTML = `<div class="dot"></div><div class="tooltip">${fmtDateShort(d)}<br>${fmtMoney(totalForDate(d))}</div>`;
    el.addEventListener('click', ()=> selectDate(d));
    track.appendChild(el);
  });
  const activeT = dates.length===1 ? 0.5 : (new Date(selectedDate+'T00:00:00').getTime()-first)/span;
  fill.style.width = (activeT*100)+'%';
}

/* ---------- Donut ---------- */
function hexToHsl(hex){
  let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h,s,l=(max+min)/2;
  if(max===min){ h=0; s=0; }
  else{
    const d=max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    if(max===r) h=(g-b)/d+(g<b?6:0);
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60;
  }
  return {h, s:s*100, l:l*100};
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  const toHex=(v)=>Math.round((v+m)*255).toString(16).padStart(2,'0');
  return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
}
function paletteFor(baseHex, n){
  if(n<=1) return [baseHex];
  const {h,s,l} = hexToHsl(baseHex);
  const colors = [];
  for(let i=0;i<n;i++){
    const t = n===1 ? 0 : i/(n-1);
    const lightness = 40 + t*38; // spreads from darker to lighter
    colors.push(hslToHex(h, s, lightness));
  }
  return colors;
}

function renderDonut(){
  const box = document.getElementById('donutCanvas');
  if(!box) return;
  const snap = (selectedDate && state.snapshots[selectedDate]) || {};
  const cats = state.categories;
  const cashTotal = cats.filter(c=>c.group==='cash').reduce((a,c)=>a+(Number(snap[c.id])||0),0);
  const investTotal = cats.filter(c=>c.group==='invest').reduce((a,c)=>a+(Number(snap[c.id])||0),0);
  const grand = cashTotal+investTotal;
  if(donutChart) donutChart.destroy();
  const ctx = box.getContext('2d');
  const centerPct = document.querySelector('#donutCenterPct');
  const centerLbl = document.querySelector('#donutCenterLbl');
  const centerSub = document.querySelector('#donutCenterSub');

  function highlightLegendRows(matchFn){
    document.querySelectorAll('#legendBox .legend-row').forEach(row=>{
      row.classList.toggle('highlight', matchFn ? matchFn(row) : false);
    });
  }

  if(donutFilter === 'total'){
    const data = [Math.max(cashTotal,0), Math.max(investTotal,0)];
    const hasData = grand !== 0;
    const showDefault = ()=>{
      centerPct.style.fontSize = '';
      centerSub.style.display = 'none';
      if(grand > 0){ centerPct.textContent = Math.round((cashTotal/grand)*100)+'%'; centerLbl.textContent = 'cash'; }
      else { centerPct.textContent = '—'; centerLbl.textContent = 'geen data'; }
      highlightLegendRows(null);
    };
    donutChart = new Chart(ctx, {
      type:'doughnut',
      data:{ labels:['Cash','Beleggingen'], datasets:[{
        data: hasData ? data : [1,1],
        backgroundColor: hasData ? ['#00E28A','#8C6DFF'] : ['#181D29','#181D29'],
        borderColor: '#12161F', borderWidth: 3, hoverOffset: 4,
      }]},
      options:{ cutout:'72%',
        plugins:{legend:{display:false}, tooltip:{enabled:false}},
        animation:{duration:400},
        onHover:(evt, active)=>{
          if(!hasData){ return; }
          if(active && active.length>0){
            const idx = active[0].index;
            const group = idx===0 ? 'cash' : 'invest';
            const val = idx===0 ? cashTotal : investTotal;
            const pct = grand!==0 ? (val/grand*100) : 0;
            centerPct.style.fontSize = '15px';
            centerPct.textContent = fmtMoney(val);
            centerLbl.textContent = group==='cash' ? 'Cash' : 'Beleggingen';
            centerSub.style.display = '';
            centerSub.style.color = group==='cash' ? '#00E28A' : '#8C6DFF';
            centerSub.textContent = pct.toFixed(0)+'% van totaal';
            highlightLegendRows(row=>row.dataset.group===group);
          } else {
            showDefault();
          }
        }
      }
    });
    showDefault();
  } else {
    const groupCats = cats.filter(c=>c.group===donutFilter);
    const groupTotal = donutFilter==='cash' ? cashTotal : investTotal;
    const baseColor = donutFilter==='cash' ? '#00E28A' : '#8C6DFF';
    const values = groupCats.map(c=>Math.max(Number(snap[c.id])||0,0));
    const hasData = groupTotal > 0;
    const colors = paletteFor(baseColor, Math.max(groupCats.length,1));
    const showDefault = ()=>{
      centerPct.style.fontSize = '15px';
      centerPct.textContent = hasData ? fmtMoney(groupTotal) : '—';
      centerLbl.textContent = donutFilter==='cash' ? 'totaal cash' : 'totaal beleggingen';
      centerSub.style.display = 'none';
      highlightLegendRows(null);
    };
    donutChart = new Chart(ctx, {
      type:'doughnut',
      data:{ labels: groupCats.map(c=>c.name), datasets:[{
        data: hasData ? values : [1],
        backgroundColor: hasData ? colors : ['#181D29'],
        borderColor: '#12161F', borderWidth: 3, hoverOffset: 4,
      }]},
      options:{ cutout:'72%',
        plugins:{legend:{display:false}, tooltip:{enabled:false}},
        animation:{duration:400},
        onHover:(evt, active)=>{
          if(!hasData){ return; }
          if(active && active.length>0){
            const idx = active[0].index;
            const cat = groupCats[idx];
            const val = values[idx];
            const pct = groupTotal!==0 ? (val/groupTotal*100) : 0;
            centerPct.style.fontSize = '14px';
            centerPct.textContent = fmtMoney(val);
            centerLbl.textContent = cat ? cat.name : '';
            centerSub.style.display = '';
            centerSub.style.color = colors[idx];
            centerSub.textContent = pct.toFixed(0)+'% van totaal';
            highlightLegendRows(row=>Number(row.dataset.idx)===idx);
          } else {
            showDefault();
          }
        }
      }
    });
    showDefault();
  }

  const legend = document.getElementById('legendBox');
  legend.innerHTML = '';

  if(categoryEditMode){
    ['cash','invest'].forEach(group=>{
      const groupCats = cats.filter(c=>c.group===group);
      const gTitle = document.createElement('div');
      gTitle.className = 'legend-group-title';
      gTitle.textContent = group==='cash' ? 'Cash posities' : 'Overige investeringen';
      legend.appendChild(gTitle);
      groupCats.forEach(c=>{
        const row = document.createElement('div');
        row.className = 'legend-row legend-row-edit';
        row.innerHTML = `<div class="sw" style="background:${group==='cash'?'#00E28A':'#8C6DFF'}"></div>
          <input class="cat-name-input" data-catid="${c.id}" value="${escapeAttr(c.name)}" placeholder="Naam">
          <button class="row-del" data-catid="${c.id}" title="Verwijder categorie">×</button>`;
        legend.appendChild(row);
      });
      const addBtn = document.createElement('button');
      addBtn.className = 'add-cat';
      addBtn.textContent = '+ Categorie toevoegen';
      addBtn.addEventListener('click', ()=>{
        state.categories.push({id:uid(), name:'Nieuwe categorie', group});
        saveState();
        renderDonut();
      });
      legend.appendChild(addBtn);
    });
    legend.querySelectorAll('.cat-name-input').forEach(inp=>{
      inp.addEventListener('change', (e)=>{
        const cat = state.categories.find(c=>c.id===e.target.dataset.catid);
        if(cat){ cat.name = e.target.value || cat.name; saveState(); renderEditor(); }
      });
    });
    legend.querySelectorAll('.row-del').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        const catId = e.target.dataset.catid;
        if(!confirm('Deze categorie verwijderen? Dit verwijdert hem ook uit alle eerdere invoer.')) return;
        state.categories = state.categories.filter(c=>c.id!==catId);
        Object.keys(state.snapshots).forEach(d=> delete state.snapshots[d][catId]);
        saveState();
        renderAll();
      });
    });
    return;
  }

  const groupsToShow = donutFilter==='total' ? ['cash','invest'] : [donutFilter];
  const denom = donutFilter==='total' ? grand : (donutFilter==='cash' ? cashTotal : investTotal);
  groupsToShow.forEach(group=>{
    const groupCats = cats.filter(c=>c.group===group);
    if(groupCats.length===0) return;
    if(donutFilter==='total'){
      const gTitle = document.createElement('div');
      gTitle.className = 'legend-group-title';
      gTitle.textContent = group==='cash' ? 'Cash posities' : 'Overige investeringen';
      legend.appendChild(gTitle);
    }
    const palette = donutFilter==='total' ? null : paletteFor(group==='cash'?'#00E28A':'#8C6DFF', groupCats.length);
    groupCats.forEach((c,i)=>{
      const val = Number(snap[c.id])||0;
      const pct = denom!==0 ? (val/denom*100) : 0;
      const swColor = donutFilter==='total' ? (group==='cash'?'#00E28A':'#8C6DFF') : palette[i];
      const row = document.createElement('div');
      row.className = 'legend-row';
      row.dataset.group = group;
      row.dataset.idx = i;
      row.innerHTML = `<div class="sw" style="background:${swColor}"></div>
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="pct">${denom!==0 ? pct.toFixed(0)+'%' : '—'}</div>
        <div class="amt num">${fmtMoney(val)}</div>`;
      legend.appendChild(row);
    });
  });
}

        y:{stacked:true, min:0, max:100, ticks:{color:'#5B6377',font:{family:'IBM Plex Mono',size:10}, callback:(v)=>v+'%'}, grid:{color:'rgba(237,239,244,0.04)'}}
      },
      onClick:(evt,elements)=>{ if(elements.length>0){ selectDate(dates[elements[0].index]); } }
    }
  });
}

/* ---------- Jaarvergelijking ---------- */
function renderYearlyChart(){
  const box = document.getElementById('yearlyCanvas');
  if(!box) return;
  const dates = sortedDates();
  if(yearlyChart) yearlyChart.destroy();
  if(dates.length === 0) return;
  const ctx = box.getContext('2d');
  const firstYear = Number(dates[0].slice(0,4));
  const nowYear = Number(todayISO().slice(0,4));
  const bars = [];
  for(let y=firstYear; y<=nowYear; y++){
    const target = `${y}-01-01`;
    if(target < dates[0]) continue;
    const snapDate = nearestSnapshotOnOrBefore(target);
    if(snapDate) bars.push({ label:'1 jan '+y, value: totalForDate(snapDate), date: snapDate });
  }
  const lastDate = dates[dates.length-1];
  const lastLabel = fmtDateShort(lastDate) + ' (nu)';
  if(bars.length===0 || bars[bars.length-1].date !== lastDate){
    bars.push({ label:lastLabel, value: totalForDate(lastDate), date:lastDate });
  }
  yearlyChart = new Chart(ctx, {
    type:'bar',
    data:{ labels: bars.map(b=>b.label), datasets:[{
      data: bars.map(b=>b.value),
      backgroundColor: bars.map((b,i)=> i===0 ? 'rgba(237,239,244,0.3)' : (b.value>=bars[i-1].value ? 'rgba(0,226,138,0.75)' : 'rgba(255,92,92,0.75)')),
      borderRadius:6, maxBarThickness:44,
    }]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{ label:(c)=>fmtMoney(c.raw) }}},
      scales:{
        x:{ticks:{color:'#5B6377',font:{family:'IBM Plex Mono',size:10}}, grid:{display:false}},
        y:{ticks:{color:'#5B6377',font:{family:'IBM Plex Mono',size:10}, callback:(v)=>fmtMoney(v)}, grid:{color:'rgba(237,239,244,0.04)'}}
      },
      onClick:(evt,elements)=>{
        const b = bars[elements[0]?.index];
        if(b && b.date) selectDate(b.date);
      }
    }
  });
}

/* ---------- Vergelijk-modus ---------- */
function initCompareDates(){
  const dates = sortedDates();
  if(dates.length===0) return;
  if(!compareDateB || !state.snapshots[compareDateB]) compareDateB = selectedDate || dates[dates.length-1];
  if(!compareDateA || !state.snapshots[compareDateA]){
    const target = periodStartISO('1J', compareDateB) || dates[0];
    compareDateA = nearestSnapshotOnOrBefore(target) || dates[0];
  }
}
function renderCompare(){
  const container = document.getElementById('compareBody');
  if(!container) return;
  initCompareDates();
  const dateAInput = document.getElementById('compareDateA');
  const dateBInput = document.getElementById('compareDateB');
  if(dateAInput) dateAInput.value = compareDateA;
  if(dateBInput) dateBInput.value = compareDateB;

  const snapA = state.snapshots[compareDateA] || {};
  const snapB = state.snapshots[compareDateB] || {};
  const cats = state.categories;

  function deltaRow(name, valA, valB, indent){
    const delta = valB - valA;
    const pct = valA !== 0 ? (delta/Math.abs(valA)*100) : null;
    const cls = delta>0 ? 'up' : delta<0 ? 'down' : 'flat';
    return `<div class="compare-row${indent?' indent':''}">
      <div class="name">${escapeHtml(name)}</div>
      <div class="val">${fmtMoney(valA)}</div>
      <div class="val">${fmtMoney(valB)}</div>
      <div class="delta ${cls}">${delta>=0?'+':'−'}${fmtMoney(Math.abs(delta))}${pct!==null ? `<span class="deltapct"> (${pct>=0?'+':'−'}${Math.abs(pct).toFixed(0)}%)</span>` : ''}</div>
    </div>`;
  }

  let html = `<div class="compare-row header">
    <div class="name">Rekening</div>
    <div class="val">${fmtDateShort(compareDateA)}</div>
    <div class="val">${fmtDateShort(compareDateB)}</div>
    <div class="delta">Verschil</div>
  </div>`;

  ['cash','invest'].forEach(group=>{
    const groupCats = cats.filter(c=>c.group===group);
    if(groupCats.length===0) return;
    html += `<div class="legend-group-title">${group==='cash' ? 'Cash posities' : 'Overige investeringen'}</div>`;
    groupCats.forEach(c=>{
      html += deltaRow(c.name, Number(snapA[c.id])||0, Number(snapB[c.id])||0, true);
    });
  });

  const cashA = groupTotalAt(compareDateA,'cash'), cashB = groupTotalAt(compareDateB,'cash');
  const investA = groupTotalAt(compareDateA,'invest'), investB = groupTotalAt(compareDateB,'invest');
  const totalA = totalForDate(compareDateA), totalB = totalForDate(compareDateB);

  html += `<div class="compare-summary">
    ${deltaRow('Totaal cash', cashA, cashB, false)}
    ${deltaRow('Totaal beleggingen', investA, investB, false)}
    ${deltaRow('Totaal vermogen', totalA, totalB, false)}
  </div>`;

  container.innerHTML = html;
}

/* ---------- Editor ---------- */
function renderEditor(){
  const container = document.getElementById('editorCard');
  if(!container) return;
  const snap = state.snapshots[selectedDate] || {};
  let html = `<div class="editor-head"><div class="t">Invoer — ${fmtDateShort(selectedDate)}</div></div>`;
  ['cash','invest'].forEach(group=>{
    const groupCats = state.categories.filter(c=>c.group===group);
    html += `<div class="group-block">
      <div class="glabel"><span class="dot" style="background:${group==='cash'?'#00E28A':'#8C6DFF'}"></span>${group==='cash'?'Cash posities':'Overige investeringen'}</div>`;
    groupCats.forEach(c=>{
      const val = snap[c.id] !== undefined ? snap[c.id] : '';
      html += `<div class="row" data-catid="${c.id}">
        <input class="name-input" data-role="name" value="${escapeAttr(c.name)}" placeholder="Naam">
        <div class="amt-input-wrap"><span class="eur">€</span>
          <input class="amt-input" data-role="amount" type="number" step="0.01" value="${val}" placeholder="0"></div>
        <button class="row-del" data-role="del" title="Verwijder categorie">×</button>
      </div>`;
    });
    html += `<button class="add-cat" data-role="addcat" data-group="${group}">+ Categorie toevoegen</button></div>`;
  });
  const total = Object.values(snap).reduce((a,b)=>a+(Number(b)||0),0);
  html += `<div class="editor-footer">
    <div class="footer-total">Totaal deze invoer: <span class="num">${fmtMoney(total)}</span></div>
    <div style="display:flex;gap:8px;">
      <button class="btn ghost" id="delSnapBtn">Verwijder invoer</button>
      <button class="btn primary" id="saveBtn">Opslaan</button>
    </div>
  </div>`;
  container.innerHTML = html;

  container.querySelectorAll('[data-role="del"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const catId = e.target.closest('.row').dataset.catid;
      state.categories = state.categories.filter(c=>c.id!==catId);
      Object.keys(state.snapshots).forEach(d=> delete state.snapshots[d][catId]);
      saveState(); renderAll();
    });
  });
  container.querySelectorAll('[data-role="addcat"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      state.categories.push({id:uid(), name:'Nieuwe categorie', group:e.target.dataset.group});
      renderEditor();
    });
  });
  container.querySelector('#saveBtn').addEventListener('click', ()=>{
    const newSnap = {};
    container.querySelectorAll('.row').forEach(row=>{
      const catId = row.dataset.catid;
      const cat = state.categories.find(c=>c.id===catId);
      if(cat) cat.name = row.querySelector('[data-role="name"]').value || cat.name;
      const amtVal = row.querySelector('[data-role="amount"]').value;
      newSnap[catId] = amtVal === '' ? 0 : Number(amtVal);
    });
    state.snapshots[selectedDate] = newSnap;
    saveState(); showToast('Opgeslagen'); renderAll();
  });
  const delBtn = container.querySelector('#delSnapBtn');
  if(delBtn){
    delBtn.addEventListener('click', ()=>{
      if(!confirm('Deze invoer verwijderen?')) return;
      delete state.snapshots[selectedDate];
      saveState();
      const dates = sortedDates();
      selectedDate = dates.length ? dates[dates.length-1] : null;
      renderAll();
    });
  }
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ---------- Main render ---------- */
function renderMain(){
  const main = document.getElementById('mainContent');
  const dates = sortedDates();
  if(dates.length===0){
    main.innerHTML = `<div class="card empty">
      <div class="etitle">Nog geen vermogen ingevoerd</div>
      <p>Begin met je eerste invoer om de verdeling en tijdlijn te zien.</p>
      <button class="btn primary" id="emptyAddBtn">+ Eerste invoer toevoegen</button>
    </div>`;
    document.getElementById('emptyAddBtn').addEventListener('click', ()=>{
      addEntryExpanded = true;
      newEntry(todayISO());
    });
    return;
  }
  main.innerHTML = `
    <div class="grid">
      <div class="card">
        <div class="card-head-row">
          <h3>${donutFilter==='total' ? 'Verdeling' : donutFilter==='cash' ? 'Cash — verdeling' : 'Beleggingen — verdeling'} op ${fmtDateShort(selectedDate)}</h3>
          <button class="btn small" id="editCatsBtn">${categoryEditMode ? 'Klaar' : 'Wijzigen'}</button>
        </div>
        <div class="donut-wrap">
          <div class="donut-canvas-box">
            <canvas id="donutCanvas"></canvas>
            <div class="donut-center"><div class="pct" id="donutCenterPct">—</div><div class="lbl" id="donutCenterLbl"></div><div class="sub" id="donutCenterSub" style="display:none;"></div></div>
          </div>
          <div class="legend" id="legendBox"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head-row">
          <h3>Vermogen over tijd</h3>
          <div class="mini-legend">
            <span class="mini-legend-item"><span class="sw-inline" style="background:#00E28A"></span>Cash</span>
            <span class="mini-legend-item"><span class="sw-inline" style="background:#8C6DFF"></span>Beleggingen</span>
          </div>
        </div>
        <div class="chart-box"><canvas id="stackedCanvas"></canvas></div>
      </div>
    </div>
    <div class="grid grid-charts">
      <div class="card">
        <h3><span class="sw-inline" style="background:#00E28A"></span>Cash over tijd</h3>
        <div class="chart-box small"><canvas id="cashLineCanvas"></canvas></div>
      </div>
      <div class="card">
        <h3><span class="sw-inline" style="background:#8C6DFF"></span>Beleggingen over tijd</h3>
        <div class="chart-box small"><canvas id="investLineCanvas"></canvas></div>
      </div>
    </div>
    <div class="grid grid-charts">
      <div class="card">
        <h3>Mutatie per periode</h3>
        <p class="card-hint">Toe- of afname tussen elke twee vastgelegde momenten.</p>
        <div class="chart-box small"><canvas id="mutationCanvas"></canvas></div>
      </div>
      <div class="card">
        <div class="card-head-row">
          <h3>Allocatie-drift</h3>
          <div class="mini-legend">
            <span class="mini-legend-item"><span class="sw-inline" style="background:#00E28A"></span>Cash</span>
            <span class="mini-legend-item"><span class="sw-inline" style="background:#8C6DFF"></span>Beleggingen</span>
          </div>
        </div>
        <div class="chart-box small"><canvas id="allocationCanvas"></canvas></div>
      </div>
    </div>
    <div class="card">
      <h3>Jaarvergelijking</h3>
      <p class="card-hint">Vermogen rond 1 januari van elk jaar, plus de meest recente stand.</p>
      <div class="chart-box"><canvas id="yearlyCanvas"></canvas></div>
    </div>
    <div class="card compare-card">
      <div class="card-head-row">
        <h3>Vergelijken</h3>
        <button class="btn small${compareExpanded ? '' : ' primary'}" id="toggleCompareBtn">${compareExpanded ? 'Sluiten' : 'Vergelijk momenten'}</button>
      </div>
      ${compareExpanded ? `
        <div class="compare-dates-row">
          <div class="compare-date-field">
            <label>Moment A</label>
            <input type="date" id="compareDateA">
          </div>
          <div class="compare-arrow">→</div>
          <div class="compare-date-field">
            <label>Moment B</label>
            <input type="date" id="compareDateB">
          </div>
        </div>
        <div id="compareBody"></div>
      ` : ''}
    </div>
    <div class="card add-entry-card">
      <div class="card-head-row">
        <h3>Nieuwe invoer</h3>
        <button class="btn small${addEntryExpanded ? '' : ' primary'}" id="toggleAddEntryBtn">${addEntryExpanded ? 'Sluiten' : '+ Nieuwe invoer'}</button>
      </div>
      ${addEntryExpanded ? `
        <p class="add-entry-hint">Kies een datum — ook in het verleden — om een stand vast te leggen of te bewerken. De categorieën hieronder werken automatisch mee met de gekozen datum.</p>
        <div class="add-entry-row">
          <input type="date" id="newEntryDate">
        </div>
        <div id="editorCard"></div>
      ` : ''}
    </div>
  `;
  const toggleBtn = document.getElementById('toggleAddEntryBtn');
  toggleBtn.addEventListener('click', ()=>{
    addEntryExpanded = !addEntryExpanded;
    if(addEntryExpanded && !selectedDate){ /* safety: pick most recent */ selectedDate = sortedDates().slice(-1)[0]; }
    renderMain();
  });
  if(addEntryExpanded){
    const dateInput = document.getElementById('newEntryDate');
    dateInput.value = selectedDate || todayISO();
    dateInput.addEventListener('change', (e)=>{
      newEntry(e.target.value || todayISO());
    });
  }
  document.getElementById('editCatsBtn').addEventListener('click', ()=>{
    categoryEditMode = !categoryEditMode;
    renderMain();
  });
  document.getElementById('toggleCompareBtn').addEventListener('click', ()=>{
    compareExpanded = !compareExpanded;
    renderMain();
  });
  if(compareExpanded){
    const dA = document.getElementById('compareDateA');
    const dB = document.getElementById('compareDateB');
    dA.addEventListener('change', (e)=>{
      const nearest = nearestSnapshotOnOrBefore(e.target.value) || sortedDates()[0];
      compareDateA = nearest;
      renderCompare();
    });
    dB.addEventListener('change', (e)=>{
      const nearest = nearestSnapshotOnOrBefore(e.target.value) || sortedDates()[0];
      compareDateB = nearest;
      renderCompare();
    });
  }
  renderDonut(); renderStackedChart(); renderCashLineChart(); renderInvestLineChart();
  renderMutationChart(); renderAllocationChart(); renderYearlyChart();
  if(compareExpanded) renderCompare();
  if(addEntryExpanded) renderEditor();
}

function newEntry(date){
  if(!state.snapshots[date]){
    const base = {};
    const nearest = nearestSnapshotOnOrBefore(date) || (sortedDates()[sortedDates().length-1]);
    if(nearest && state.snapshots[nearest]){
      state.categories.forEach(c=> base[c.id] = state.snapshots[nearest][c.id] || 0);
    } else { state.categories.forEach(c=> base[c.id] = 0); }
    state.snapshots[date] = base; saveState();
  }
  selectedDate = date; renderAll();
}

function renderAll(){
  const dates = sortedDates();
  if(!selectedDate || !state.snapshots[selectedDate]){
    selectedDate = dates.length ? dates[dates.length-1] : null;
  }
  renderPeriodRow(); renderStats(); renderLedger(); renderHero(); renderMain();
}

function jumpToDate(date){
  if(!date) return;
  const dates = sortedDates();
  if(dates.length===0) return;
  let nearest = nearestSnapshotOnOrBefore(date);
  if(!nearest) nearest = dates[0]; // gekozen datum ligt voor de eerste invoer
  selectDate(nearest);
}
document.getElementById('jumpDate').addEventListener('change', (e)=>{
  jumpToDate(e.target.value);
});

/* ---------- Export / import backup ---------- */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const payload = JSON.stringify(state, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayISO();
  a.href = url;
  a.download = `grootboek-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Back-up gedownload');
});
document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    let parsed;
    try{ parsed = JSON.parse(ev.target.result); }
    catch(err){ showToast('Ongeldig bestand'); e.target.value=''; return; }
    if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.categories) || typeof parsed.snapshots !== 'object'){
      showToast('Bestand mist categorieën of invoer');
      e.target.value='';
      return;
    }
    const n = Object.keys(parsed.snapshots).length;
    if(!confirm(`Dit vervangt je huidige gegevens door de back-up (${n} invoermomenten, ${parsed.categories.length} categorieën). Doorgaan?`)){
      e.target.value='';
      return;
    }
    state = { categories: parsed.categories, snapshots: parsed.snapshots };
    await saveState();
    const dates = sortedDates();
    selectedDate = dates.length ? dates[dates.length-1] : null;
    e.target.value = '';
    showToast('Back-up geïmporteerd');
    renderAll();
  };
  reader.readAsText(file);
});

(async function init(){
  await loadState();
  const dates = sortedDates();
  selectedDate = dates.length ? dates[dates.length-1] : null;
  renderAll();
})();
</script>
</body>

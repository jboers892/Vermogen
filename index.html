<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vermogen</title>
<meta name="theme-color" content="#0A0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vermogen">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0A0D12;
    --surface:#12161F;
    --surface-2:#181D29;
    --hairline:rgba(237,239,244,0.07);
    --hairline-strong:rgba(237,239,244,0.14);
    --ivory:#EDEFF4;
    --muted:#8891A3;
    --muted-dim:#5B6377;
    --green:#00E28A;
    --green-soft:rgba(0,226,138,0.14);
    --purple:#8C6DFF;
    --purple-soft:rgba(140,109,255,0.16);
    --red:#FF5C5C;
    --red-soft:rgba(255,92,92,0.14);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ivory);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:64px;
  }
  .wrap{max-width:960px;margin:0 auto;padding:24px 18px 0;}
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

  .masthead{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:16px;margin-bottom:20px;
  }
  .masthead .brand{font-size:14px;font-weight:700;letter-spacing:-0.01em;color:var(--ivory);display:flex;align-items:center;gap:8px;}
  .masthead .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}
  .masthead .date-view{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}

  .hero{padding:4px 0 20px;}
  .hero-title{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .hero .amount{font-family:'Inter',sans-serif;font-weight:800;font-size:clamp(36px,9vw,54px);line-height:1;letter-spacing:-0.02em;}
  .hero .delta{margin-top:12px;font-size:13px;}

  .badge{
    display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;
    padding:4px 9px;border-radius:20px;font-family:'IBM Plex Mono',monospace;
  }
  .badge.up{background:var(--green-soft);color:var(--green);}
  .badge.down{background:var(--red-soft);color:var(--red);}
  .badge.flat{background:var(--surface-2);color:var(--muted);}

  /* Period selector */
  .period-row{display:flex;gap:6px;margin:14px 0 22px;flex-wrap:wrap;}
  .period-chip{
    font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--muted);
    background:var(--surface);border:1px solid var(--hairline);border-radius:8px;
    padding:6px 12px;cursor:pointer;transition:all .12s ease;
  }
  .period-chip:hover{border-color:var(--hairline-strong);color:var(--ivory);}
  .period-chip.active{background:var(--ivory);color:#0A0D12;border-color:var(--ivory);}

  /* Stat cards: totaal / cash / beleggingen */
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px;}
  .stat-card{background:var(--surface);border:1px solid var(--hairline);border-radius:12px;padding:14px 14px 12px;}
  .stat-card .slabel{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .stat-card .slabel .sw{width:7px;height:7px;border-radius:50%;}
  .stat-card .samount{font-size:16px;font-weight:700;font-family:'IBM Plex Mono',monospace;margin-bottom:8px;}
  .stat-card .speriod{font-size:10px;color:var(--muted-dim);margin-top:6px;}
  @media(max-width:520px){
    .stat-card .samount{font-size:13px;}
    .stats-grid{gap:7px;}
    .stat-card{padding:10px 9px;}
  }

  /* Ledger scrubber */
  .ledger{position:relative;margin:0 0 26px;padding:16px 0 8px;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);}
  .ledger-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .ledger-title .t{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted-dim);font-weight:700;}
  .ledger-actions{display:flex;gap:8px;}
  .track{position:relative;height:44px;}
  .track .rail{position:absolute;top:22px;left:0;right:0;height:1px;background:var(--hairline-strong);}
  .track .fill{position:absolute;top:22px;left:0;height:2px;background:var(--green);}
  .tick{position:absolute;top:16px;width:1px;height:13px;background:var(--muted-dim);cursor:pointer;}
  .tick.active{background:var(--green);width:2px;top:13px;height:19px;}
  .tick .dot{position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--green);display:none;}
  .tick.active .dot{display:block;}
  .tick:hover .tooltip{display:block;}
  .tooltip{display:none;position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--hairline-strong);border-radius:6px;padding:4px 8px;font-size:11px;white-space:nowrap;font-family:'IBM Plex Mono',monospace;color:var(--ivory);pointer-events:none;}

  .btn{font-family:'Inter',sans-serif;font-size:12px;font-weight:700;background:transparent;color:var(--muted);border:1px solid var(--hairline-strong);border-radius:10px;padding:7px 13px;cursor:pointer;transition:all .15s ease;}
  .btn:hover{border-color:var(--green);color:var(--green);}
  .btn.primary{background:var(--green);color:#06140D;border-color:var(--green);}
  .btn.primary:hover{background:#33e9a2;color:#06140D;}
  .btn.ghost{border-color:transparent;color:var(--muted-dim);}
  .btn.ghost:hover{color:var(--red);border-color:transparent;}
  .btn.small{padding:5px 11px;font-size:11px;}

  .grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px;}
  @media(min-width:720px){.grid{grid-template-columns:0.85fr 1.15fr;}}
  .card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius);padding:18px;}
  .card h3{margin:0 0 16px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted-dim);font-weight:700;}

  .donut-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .donut-canvas-box{position:relative;width:170px;height:170px;}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
  .donut-center .pct{font-size:22px;font-weight:800;}
  .donut-center .lbl{font-size:9px;color:var(--muted-dim);text-transform:uppercase;letter-spacing:0.06em;}
  .legend{width:100%;display:flex;flex-direction:column;gap:10px;}
  .legend-row{display:flex;align-items:center;gap:10px;font-size:13px;}
  .legend-row .sw{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
  .legend-row .name{flex:1;color:var(--ivory);}
  .legend-row .pct{color:var(--muted);width:44px;text-align:right;}
  .legend-row .amt{font-family:'IBM Plex Mono',monospace;width:92px;text-align:right;font-size:12px;}
  .legend-group-title{font-size:10px;color:var(--muted-dim);text-transform:uppercase;letter-spacing:0.06em;margin:10px 0 6px;}
  .legend-group-title:first-child{margin-top:0;}

  .chart-box{height:230px;}

  .editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .editor-head .t{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted-dim);font-weight:700;}
  .group-block{margin-top:16px;}
  .group-block .glabel{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:7px;font-weight:600;}
  .group-block .glabel .dot{width:7px;height:7px;border-radius:50%;}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hairline);}
  .row:last-child{border-bottom:none;}
  .row input.name-input{flex:1;background:transparent;border:none;color:var(--ivory);font-family:'Inter',sans-serif;font-size:14px;outline:none;padding:4px 0;}
  .row input.name-input::placeholder{color:var(--muted-dim);}
  .row .amt-input-wrap{display:flex;align-items:center;gap:4px;}
  .row .amt-input-wrap .eur{color:var(--muted-dim);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .row input.amt-input{width:120px;background:var(--surface-2);border:1px solid var(--hairline);border-radius:8px;color:var(--ivory);font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:right;padding:6px 9px;outline:none;}
  .row input.amt-input:focus{border-color:var(--green);}
  .row-del{background:none;border:none;color:var(--muted-dim);cursor:pointer;font-size:15px;padding:2px 4px;line-height:1;}
  .row-del:hover{color:var(--red);}
  .add-cat{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--muted-dim);background:none;border:1px dashed var(--hairline-strong);border-radius:10px;padding:7px 12px;cursor:pointer;width:100%;justify-content:center;}
  .add-cat:hover{color:var(--green);border-color:var(--green);}

  .editor-footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--hairline);flex-wrap:wrap;gap:10px;}
  .footer-total{font-size:13px;color:var(--muted);}
  .footer-total .num{color:var(--ivory);}

  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty .etitle{font-size:19px;font-weight:700;color:var(--ivory);margin-bottom:6px;}
  .empty p{font-size:13px;margin:0 0 18px;color:var(--muted-dim);}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green);color:#06140D;font-size:13px;font-weight:700;padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  ::selection{background:var(--green-soft);}
  input[type="date"]{background:var(--surface-2);border:1px solid var(--hairline);border-radius:8px;color:var(--ivory);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 8px;outline:none;color-scheme:dark;}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="brand"><span class="dot"></span>Vermogen</div>
    <div class="date-view" id="dateViewLabel">—</div>
  </div>

  <div class="hero">
    <div class="hero-title" id="heroTitle">Vermogen</div>
    <div class="amount num" id="heroAmount">€ 0</div>
    <div class="delta flat" id="heroDelta"></div>
  </div>

  <div class="period-row" id="periodRow"></div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="ledger" id="ledgerBlock">
    <div class="ledger-title">
      <div class="t">Tijdreis</div>
      <div class="ledger-actions">
        <input type="date" id="jumpDate">
        <button class="btn primary small" id="newEntryBtn">+ Nieuwe invoer</button>
      </div>
    </div>
    <div class="track" id="track">
      <div class="rail"></div>
      <div class="fill" id="fill"></div>
    </div>
  </div>

  <div id="mainContent"></div>

</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'wealth-data';
let state = { categories: [], snapshots: {} };
let selectedDate = null;
let selectedPeriod = 'ALL';
let donutChart = null;
let lineChart = null;

const PERIODS = [
  {key:'1M', label:'1M'},
  {key:'3M', label:'3M'},
  {key:'6M', label:'6M'},
  {key:'YTD', label:'YTD'},
  {key:'1J', label:'1J'},
  {key:'ALL', label:'Alles'},
];

const fmtMoney = (v) => new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v||0);
const fmtDateShort = (iso) => new Date(iso+'T00:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'});
const todayISO = () => new Date().toISOString().slice(0,10);
const uid = () => Math.random().toString(36).slice(2,9);
const fmtPct = (v) => (v>0?'+':v<0?'−':'') + Math.abs(v).toFixed(1).replace('.',',') + '%';

function defaultCategories(){
  return [
    {id: 'c1', name:'Betaalrekening ING', group:'cash'},
    {id: 'c2', name:'Spaarrekening ABN Amro', group:'cash'},
    {id: 'c3', name:'Spaarrekening ING', group:'cash'},
    {id: 'c4', name:'Effectenrekening 1', group:'invest'},
    {id: 'c5', name:'Effectenrekening 2', group:'invest'},
    {id: 'c6', name:'Synvest', group:'invest'},
    {id: 'c7', name:'Effectenrekening De Giro', group:'invest'},
  ];
}
function historicalSeed(){
  return {
    '2023-01-01': { c1:8000,  c2:35000, c3:0,     c4:0, c5:0,      c6:2500, c7:25500  },
    '2023-06-01': { c1:8000,  c2:38000, c3:0,     c4:0, c5:0,      c6:2550, c7:31000  },
    '2024-01-01': { c1:5500,  c2:50500, c3:0,     c4:0, c5:0,      c6:2600, c7:38500  },
    '2024-01-25': { c1:7200,  c2:50500, c3:0,     c4:0, c5:0,      c6:2600, c7:40500  },
    '2024-04-25': { c1:9500,  c2:51000, c3:0,     c4:0, c5:0,      c6:2600, c7:44500  },
    '2024-08-01': { c1:7500,  c2:51800, c3:100000,c4:0, c5:0,      c6:2680, c7:50000  },
    '2025-01-01': { c1:9500,  c2:47000, c3:68000, c4:0, c5:0,      c6:2690, c7:59000  },
    '2025-08-01': { c1:900,   c2:42000, c3:27000, c4:73000, c5:100000, c6:2800, c7:0  },
    '2026-04-18': { c1:1200,  c2:32000, c3:27000, c4:83000, c5:116000, c6:2972, c7:0  },
  };
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      state = JSON.parse(res.value);
      if(!state.categories || state.categories.length===0) state.categories = defaultCategories();
      if(!state.snapshots) state.snapshots = {};
    } else {
      state = {categories: defaultCategories(), snapshots: {}};
    }
    // Niet-destructieve aanvulling: voeg ontbrekende categorieën en historische
    // invoerdata toe zonder bestaande, mogelijk al aangepaste data te overschrijven.
    let changed = false;
    defaultCategories().forEach(dc=>{
      if(!state.categories.find(c=>c.id===dc.id)){ state.categories.push(dc); changed = true; }
    });
    const seed = historicalSeed();
    Object.keys(seed).forEach(d=>{
      if(!state.snapshots[d]){ state.snapshots[d] = seed[d]; changed = true; }
    });
    if(changed) await saveState();
  }catch(e){
    state = {categories: defaultCategories(), snapshots: historicalSeed()};
  }
}
async function saveState(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
  catch(e){ showToast('Opslaan mislukt — probeer opnieuw'); }
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}

function sortedDates(){ return Object.keys(state.snapshots).sort(); }
function totalForDate(date){
  const snap = state.snapshots[date];
  if(!snap) return 0;
  return Object.values(snap).reduce((a,b)=>a+(Number(b)||0),0);
}
function groupTotalAt(date, group){
  const snap = state.snapshots[date] || {};
  return state.categories.filter(c=>c.group===group).reduce((a,c)=>a+(Number(snap[c.id])||0),0);
}
function nearestSnapshotOnOrBefore(date){
  const dates = sortedDates().filter(d=>d<=date);
  return dates.length ? dates[dates.length-1] : null;
}
function valueAt(date, group){
  const snapDate = nearestSnapshotOnOrBefore(date);
  if(!snapDate) return null;
  if(group==='total') return totalForDate(snapDate);
  return groupTotalAt(snapDate, group);
}
function periodStartISO(period, refISO){
  const ref = new Date(refISO+'T00:00:00');
  let d = new Date(ref);
  if(period==='1M') d.setMonth(d.getMonth()-1);
  else if(period==='3M') d.setMonth(d.getMonth()-3);
  else if(period==='6M') d.setMonth(d.getMonth()-6);
  else if(period==='1J') d.setFullYear(d.getFullYear()-1);
  else if(period==='YTD') d = new Date(ref.getFullYear(),0,1);
  else return null;
  return d.toISOString().slice(0,10);
}
function growthPct(group, period, refDate){
  const dates = sortedDates();
  if(dates.length===0) return null;
  const endVal = valueAt(refDate, group);
  let startVal;
  if(period==='ALL'){
    startVal = valueAt(dates[0], group);
  } else {
    let target = periodStartISO(period, refDate);
    if(target < dates[0]) target = dates[0];
    startVal = valueAt(target, group);
  }
  if(startVal===null || endVal===null || startVal===0) return null;
  return ((endVal-startVal)/Math.abs(startVal))*100;
}

/* ---------- Period chips ---------- */
function renderPeriodRow(){
  const row = document.getElementById('periodRow');
  row.innerHTML = '';
  PERIODS.forEach(p=>{
    const chip = document.createElement('div');
    chip.className = 'period-chip' + (p.key===selectedPeriod ? ' active' : '');
    chip.textContent = p.label;
    chip.addEventListener('click', ()=>{ selectedPeriod = p.key; renderAll(); });
    row.appendChild(chip);
  });
}

/* ---------- Stat cards ---------- */
function renderStats(){
  const grid = document.getElementById('statsGrid');
  if(!selectedDate){ grid.innerHTML=''; return; }
  const groups = [
    {key:'total', label:'Totaal', color:'var(--ivory)'},
    {key:'cash', label:'Cash', color:'var(--green)'},
    {key:'invest', label:'Beleggingen', color:'var(--purple)'},
  ];
  grid.innerHTML = groups.map(g=>{
    const amount = g.key==='total' ? totalForDate(selectedDate) : groupTotalAt(selectedDate, g.key);
    const periodG = growthPct(g.key, selectedPeriod, selectedDate);
    const allG = growthPct(g.key, 'ALL', selectedDate);
    const pClass = periodG===null ? 'flat' : periodG>0 ? 'up' : periodG<0 ? 'down' : 'flat';
    const aClass = allG===null ? 'flat' : allG>0 ? 'up' : allG<0 ? 'down' : 'flat';
    return `<div class="stat-card">
      <div class="slabel">${g.key!=='total' ? `<span class="sw" style="background:${g.color}"></span>`:''}${g.label}</div>
      <div class="samount">${fmtMoney(amount)}</div>
      <span class="badge ${pClass}">${periodG===null ? '—' : fmtPct(periodG)}</span>
      <div class="speriod">All-time: <span class="badge ${aClass}" style="padding:2px 6px;">${allG===null?'—':fmtPct(allG)}</span></div>
    </div>`;
  }).join('');
}

/* ---------- Ledger scrubber ---------- */
function renderLedger(){
  const track = document.getElementById('track');
  const fill = document.getElementById('fill');
  track.querySelectorAll('.tick').forEach(n=>n.remove());
  const dates = sortedDates();
  document.getElementById('jumpDate').value = selectedDate || todayISO();
  if(dates.length===0){ fill.style.width='0%'; return; }
  const first = new Date(dates[0]+'T00:00:00').getTime();
  const last = new Date(dates[dates.length-1]+'T00:00:00').getTime();
  const span = Math.max(last-first, 1);
  dates.forEach(d=>{
    const t = (new Date(d+'T00:00:00').getTime()-first)/span;
    const pct = dates.length===1 ? 50 : t*100;
    const el = document.createElement('div');
    el.className = 'tick' + (d===selectedDate ? ' active' : '');
    el.style.left = `calc(${pct}% - 1px)`;
    el.innerHTML = `<div class="dot"></div><div class="tooltip">${fmtDateShort(d)}<br>${fmtMoney(totalForDate(d))}</div>`;
    el.addEventListener('click', ()=> selectDate(d));
    track.appendChild(el);
  });
  const activeT = dates.length===1 ? 0.5 : (new Date(selectedDate+'T00:00:00').getTime()-first)/span;
  fill.style.width = (activeT*100)+'%';
}
function selectDate(date){ selectedDate = date; document.getElementById('jumpDate').value = date; renderAll(); }

/* ---------- Hero ---------- */
function renderHero(){
  const dates = sortedDates();
  const total = selectedDate ? totalForDate(selectedDate) : 0;
  document.getElementById('heroTitle').textContent = selectedDate ? ('Vermogen — ' + fmtDateShort(selectedDate)) : 'Vermogen';
  document.getElementById('heroAmount').textContent = fmtMoney(total);
  document.getElementById('dateViewLabel').textContent = selectedDate ? fmtDateShort(selectedDate) : 'Nog geen gegevens';

  const idx = dates.indexOf(selectedDate);
  const deltaEl = document.getElementById('heroDelta');
  if(idx > 0){
    const prevTotal = totalForDate(dates[idx-1]);
    const diff = total - prevTotal;
    const pct = prevTotal !== 0 ? (diff/Math.abs(prevTotal))*100 : 0;
    deltaEl.innerHTML = `<span class="badge ${diff>0?'up':diff<0?'down':'flat'}">${fmtPct(pct)}</span> <span style="color:var(--muted);margin-left:6px;">${diff>=0?'+':'−'}${fmtMoney(Math.abs(diff))} t.o.v. ${fmtDateShort(dates[idx-1])}</span>`;
  } else if(dates.length>0){
    deltaEl.innerHTML = `<span style="color:var(--muted-dim);">Eerste invoer in dit grootboek</span>`;
  } else { deltaEl.textContent = ''; }
}

/* ---------- Donut ---------- */
function renderDonut(){
  const box = document.getElementById('donutCanvas');
  if(!box) return;
  const snap = (selectedDate && state.snapshots[selectedDate]) || {};
  const cats = state.categories;
  const cashTotal = cats.filter(c=>c.group==='cash').reduce((a,c)=>a+(Number(snap[c.id])||0),0);
  const investTotal = cats.filter(c=>c.group==='invest').reduce((a,c)=>a+(Number(snap[c.id])||0),0);
  const grand = cashTotal+investTotal;
  const data = [Math.max(cashTotal,0), Math.max(investTotal,0)];
  const hasData = grand !== 0;
  if(donutChart) donutChart.destroy();
  const ctx = box.getContext('2d');
  donutChart = new Chart(ctx, {
    type:'doughnut',
    data:{ labels:['Cash','Beleggingen'], datasets:[{
      data: hasData ? data : [1,1],
      backgroundColor: hasData ? ['#00E28A','#8C6DFF'] : ['#181D29','#181D29'],
      borderColor: '#12161F', borderWidth: 3, hoverOffset: 4,
    }]},
    options:{ cutout:'72%',
      plugins:{legend:{display:false}, tooltip:{enabled:hasData, callbacks:{label:(c)=>' '+c.label+': '+fmtMoney(c.raw)}}},
      animation:{duration:400},
    }
  });
  const centerPct = document.querySelector('#donutCenterPct');
  const centerLbl = document.querySelector('#donutCenterLbl');
  if(grand > 0){ centerPct.textContent = Math.round((cashTotal/grand)*100)+'%'; centerLbl.textContent = 'cash'; }
  else { centerPct.textContent = '—'; centerLbl.textContent = 'geen data'; }
  const legend = document.getElementById('legendBox');
  legend.innerHTML = '';
  ['cash','invest'].forEach(group=>{
    const groupCats = cats.filter(c=>c.group===group);
    if(groupCats.length===0) return;
    const gTitle = document.createElement('div');
    gTitle.className = 'legend-group-title';
    gTitle.textContent = group==='cash' ? 'Cash posities' : 'Overige investeringen';
    legend.appendChild(gTitle);
    groupCats.forEach(c=>{
      const val = Number(snap[c.id])||0;
      const pct = grand!==0 ? (val/grand*100) : 0;
      const row = document.createElement('div');
      row.className = 'legend-row';
      row.innerHTML = `<div class="sw" style="background:${group==='cash'?'#00E28A':'#8C6DFF'}"></div>
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="pct">${grand!==0 ? pct.toFixed(0)+'%' : '—'}</div>
        <div class="amt num">${fmtMoney(val)}</div>`;
      legend.appendChild(row);
    });
  });
}

/* ---------- Line chart ---------- */
function renderLineChart(){
  const box = document.getElementById('lineCanvas');
  if(!box) return;
  const dates = sortedDates();
  if(lineChart) lineChart.destroy();
  const ctx = box.getContext('2d');
  const gradient = ctx.createLinearGradient(0,0,0,230);
  gradient.addColorStop(0, 'rgba(0,226,138,0.28)');
  gradient.addColorStop(1, 'rgba(0,226,138,0.0)');
  lineChart = new Chart(ctx, {
    type:'line',
    data:{ labels: dates.map(d=>fmtDateShort(d)), datasets:[{
      data: dates.map(d=>totalForDate(d)),
      borderColor:'#00E28A', backgroundColor:gradient,
      pointBackgroundColor: dates.map(d=> d===selectedDate ? '#EDEFF4' : '#00E28A'),
      pointRadius: dates.map(d=> d===selectedDate ? 5 : 3),
      pointHoverRadius:6, borderWidth:2, fill:true, tension:0.3,
    }]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:(c)=>fmtMoney(c.raw)}}},
      scales:{
        x:{ticks:{color:'#5B6377',font:{family:'IBM Plex Mono',size:10}}, grid:{color:'rgba(237,239,244,0.04)'}},
        y:{ticks:{color:'#5B6377',font:{family:'IBM Plex Mono',size:10}, callback:(v)=>fmtMoney(v)}, grid:{color:'rgba(237,239,244,0.04)'}}
      },
      onClick:(evt,elements)=>{ if(elements.length>0){ selectDate(dates[elements[0].index]); } }
    }
  });
}

/* ---------- Editor ---------- */
function renderEditor(){
  const container = document.getElementById('editorCard');
  if(!container) return;
  const snap = state.snapshots[selectedDate] || {};
  let html = `<div class="editor-head"><div class="t">Invoer — ${fmtDateShort(selectedDate)}</div></div>`;
  ['cash','invest'].forEach(group=>{
    const groupCats = state.categories.filter(c=>c.group===group);
    html += `<div class="group-block">
      <div class="glabel"><span class="dot" style="background:${group==='cash'?'#00E28A':'#8C6DFF'}"></span>${group==='cash'?'Cash posities':'Overige investeringen'}</div>`;
    groupCats.forEach(c=>{
      const val = snap[c.id] !== undefined ? snap[c.id] : '';
      html += `<div class="row" data-catid="${c.id}">
        <input class="name-input" data-role="name" value="${escapeAttr(c.name)}" placeholder="Naam">
        <div class="amt-input-wrap"><span class="eur">€</span>
          <input class="amt-input" data-role="amount" type="number" step="0.01" value="${val}" placeholder="0"></div>
        <button class="row-del" data-role="del" title="Verwijder categorie">×</button>
      </div>`;
    });
    html += `<button class="add-cat" data-role="addcat" data-group="${group}">+ Categorie toevoegen</button></div>`;
  });
  const total = Object.values(snap).reduce((a,b)=>a+(Number(b)||0),0);
  html += `<div class="editor-footer">
    <div class="footer-total">Totaal deze invoer: <span class="num">${fmtMoney(total)}</span></div>
    <div style="display:flex;gap:8px;">
      <button class="btn ghost" id="delSnapBtn">Verwijder invoer</button>
      <button class="btn primary" id="saveBtn">Opslaan</button>
    </div>
  </div>`;
  container.innerHTML = html;

  container.querySelectorAll('[data-role="del"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const catId = e.target.closest('.row').dataset.catid;
      state.categories = state.categories.filter(c=>c.id!==catId);
      Object.keys(state.snapshots).forEach(d=> delete state.snapshots[d][catId]);
      saveState(); renderAll();
    });
  });
  container.querySelectorAll('[data-role="addcat"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      state.categories.push({id:uid(), name:'Nieuwe categorie', group:e.target.dataset.group});
      renderEditor();
    });
  });
  container.querySelector('#saveBtn').addEventListener('click', ()=>{
    const newSnap = {};
    container.querySelectorAll('.row').forEach(row=>{
      const catId = row.dataset.catid;
      const cat = state.categories.find(c=>c.id===catId);
      if(cat) cat.name = row.querySelector('[data-role="name"]').value || cat.name;
      const amtVal = row.querySelector('[data-role="amount"]').value;
      newSnap[catId] = amtVal === '' ? 0 : Number(amtVal);
    });
    state.snapshots[selectedDate] = newSnap;
    saveState(); showToast('Opgeslagen'); renderAll();
  });
  const delBtn = container.querySelector('#delSnapBtn');
  if(delBtn){
    delBtn.addEventListener('click', ()=>{
      if(!confirm('Deze invoer verwijderen?')) return;
      delete state.snapshots[selectedDate];
      saveState();
      const dates = sortedDates();
      selectedDate = dates.length ? dates[dates.length-1] : null;
      renderAll();
    });
  }
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ---------- Main render ---------- */
function renderMain(){
  const main = document.getElementById('mainContent');
  const dates = sortedDates();
  if(dates.length===0){
    main.innerHTML = `<div class="card empty">
      <div class="etitle">Nog geen vermogen ingevoerd</div>
      <p>Begin met je eerste invoer om de verdeling en tijdlijn te zien.</p>
      <button class="btn primary" id="emptyAddBtn">+ Eerste invoer toevoegen</button>
    </div>`;
    document.getElementById('emptyAddBtn').addEventListener('click', ()=> newEntry(todayISO()));
    return;
  }
  main.innerHTML = `
    <div class="grid">
      <div class="card">
        <h3>Verdeling op ${fmtDateShort(selectedDate)}</h3>
        <div class="donut-wrap">
          <div class="donut-canvas-box">
            <canvas id="donutCanvas"></canvas>
            <div class="donut-center"><div class="pct" id="donutCenterPct">—</div><div class="lbl" id="donutCenterLbl"></div></div>
          </div>
          <div class="legend" id="legendBox"></div>
        </div>
      </div>
      <div class="card">
        <h3>Vermogen over tijd</h3>
        <div class="chart-box"><canvas id="lineCanvas"></canvas></div>
      </div>
    </div>
    <div class="card" id="editorCard"></div>
  `;
  renderDonut(); renderLineChart(); renderEditor();
}

function newEntry(date){
  if(!state.snapshots[date]){
    const base = {};
    const nearest = nearestSnapshotOnOrBefore(date) || (sortedDates()[sortedDates().length-1]);
    if(nearest && state.snapshots[nearest]){
      state.categories.forEach(c=> base[c.id] = state.snapshots[nearest][c.id] || 0);
    } else { state.categories.forEach(c=> base[c.id] = 0); }
    state.snapshots[date] = base; saveState();
  }
  selectedDate = date; renderAll();
}

function renderAll(){
  const dates = sortedDates();
  if(!selectedDate || !state.snapshots[selectedDate]){
    selectedDate = dates.length ? dates[dates.length-1] : null;
  }
  renderPeriodRow(); renderStats(); renderLedger(); renderHero(); renderMain();
}

document.getElementById('newEntryBtn').addEventListener('click', ()=>{
  newEntry(document.getElementById('jumpDate').value || todayISO());
});
document.getElementById('jumpDate').addEventListener('change', (e)=>{
  if(state.snapshots[e.target.value]) selectDate(e.target.value);
});

(async function init(){
  await loadState();
  const dates = sortedDates();
  selectedDate = dates.length ? dates[dates.length-1] : null;
  renderAll();
})();
</script>
</body>
</html>
